<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button [defaultHref]="'/game/' + gameId"></ion-back-button>
    </ion-buttons>
    <ion-title>Historial {{ gameId }}</ion-title>
    <ion-buttons slot="end">
      <ion-button [disabled]="loading" (click)="refresh()">Actualizar</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <ion-note *ngIf="errorMessage" color="danger">{{ errorMessage }}</ion-note>
  <ion-progress-bar *ngIf="loading" type="indeterminate"></ion-progress-bar>

  <ion-list inset>
    <ion-item *ngFor="let question of questions">
      <ion-label class="ion-text-wrap">
        <div class="question-heading">
          <h2>{{ question.prompt }}</h2>
          <ion-badge [color]="statusColor(question)">{{ statusLabel(question) }}</ion-badge>
        </div>
        <p>{{ questionMeta(question) }}</p>
        <p><strong>Respuesta:</strong> {{ answerLabel(question) }}</p>
        <p *ngIf="question.resolvedAtIso">Respondida: {{ formatDate(question.resolvedAtIso) }}</p>
      </ion-label>
    </ion-item>
    <ion-item *ngIf="!loading && questions.length === 0">
      <ion-label>No hay preguntas registradas.</ion-label>
    </ion-item>
  </ion-list>
</ion-content>
