<ion-card class="hider-card">
  <ion-card-header>
    <ion-card-title>{{ card.title }}</ion-card-title>
  </ion-card-header>

  <ion-card-content>
    <p class="description">{{ card.description }}</p>
    <p class="casting-cost">Casting cost: {{ card.castingCost }}</p>
  </ion-card-content>
</ion-card>
